# riscv-formal configuration for the Strata S1 core (see docs/verification.md).

[options]
isa rv32i
nret 1
solver yices

[depth]
insn            12
reg        8    12
pc_fwd     8    12
pc_bwd     8    12
unique     1 8  12
causal     8    12
ill             12
cover      1    12

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ILEN 32
`define RISCV_FORMAL_XLEN 32

[verilog-files]
@basedir@/cores/@core@/wrapper.sv

[script-sources]
plugin -i slang
read_slang -D RISCV_FORMAL --keep-hierarchy @rtl@/core/st_pkg.sv @rtl@/core/st_decode.sv @rtl@/core/st_alu.sv @rtl@/core/st_regfile.sv @rtl@/core/st_pmp.sv @rtl@/core/st_csr.sv @rtl@/core/st_fetch.sv @rtl@/core/st_core.sv --top st_core

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
